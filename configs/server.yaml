reference_data:
  instrument:
    instrument_id: 1001 # BTC-USD
    base_asset_id: 1 # BTC
    quote_asset_id: 2 # USD
    price_decimals: 2 # price integer has 2 quote decimals per 1 base asset
    qty_decimals: 8 # quantity integer has 8 base decimals
    price_tick: 1 # minimum price increment in price integer units
    qty_lot: 1 # minimum quantity increment in quantity integer units
engine:
  storage_min_price: 1000000 # $10,000.00 with price_decimals=2
  storage_max_price: 25000000 # $250,000.00 with price_decimals=2
  page_size: 1024
  max_resting_orders: 100000
  max_account_id: 100000
  max_active_pages: 4096
risk:
  max_open_orders_per_account: 1000
  max_open_notional_per_account: 100000000000000000
  startup_reference_price: 10000000 # $100,000.00 with price_decimals=2
  price_band_bps: 1000 # +/-10%
