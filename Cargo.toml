[package]
name = "ignition"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "bin/server.rs"

[[bin]]
name = "trading-client"
path = "bin/trading_client.rs"

[[bin]]
name = "control-client"
path = "bin/control_client.rs"

[[bin]]
name = "replay"
path = "bin/replay.rs"

[[bin]]
name = "benchmark"
path = "bin/benchmark.rs"

[dependencies]
ignition_protocol_generated = { path = "protocol/generated" }
crossterm = "0.28"
hdrhistogram = "7.5"
ratatui = "0.29"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
proptest = "1"
