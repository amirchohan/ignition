services:
  server:
    build: .
    command: ["server"]
    environment:
      IGNITION_CONTROL_LISTEN_ADDR: "0.0.0.0:19001"
      IGNITION_GATEWAY_LISTEN_ADDR: "0.0.0.0:19000"
    ports:
      - "19000:19000/tcp"
      - "19001:19001/tcp"
      - "19002:19002/udp"
    volumes:
      - ./fixtures/replay/runs:/app/fixtures/replay/runs

  trading-client:
    build: .
    command: ["trading-client", "--config", "configs/trading-client.yaml"]
    depends_on:
      - server
    stdin_open: true
    tty: true
    environment:
      TERM: "${TERM:-xterm-256color}"
      IGNITION_GATEWAY_ADDR: "server:19000"
      IGNITION_SYNTHETIC_TRAFFIC: "noop"

  control-client:
    build: .
    command: ["control-client", "--config", "configs/control-client.yaml"]
    depends_on:
      - server
    stdin_open: true
    tty: true
    environment:
      TERM: "${TERM:-xterm-256color}"
      IGNITION_CONTROL_ADDR: "server:19001"

  benchmark:
    build: .
    command:
      - /bin/sh
      - -c
      - |
        set -- benchmark \
          --orders "$${ORDERS:-1000000}" \
          --warmup "$${WARMUP:-50000}" \
          --workload "$${WORKLOAD:-mixed}" \
          --schedule "$${SCHEDULE:-burst}"
        if [ "$${SCHEDULE:-burst}" = "open-loop" ]; then
          set -- "$$@" --target-rate "$${TARGET_RATE:?TARGET_RATE is required for open-loop benchmarks}"
        fi
        exec "$$@"
    environment:
      ORDERS: "${ORDERS:-1000000}"
      WARMUP: "${WARMUP:-50000}"
      WORKLOAD: "${WORKLOAD:-mixed}"
      SCHEDULE: "${SCHEDULE:-burst}"
      TARGET_RATE: "${TARGET_RATE:-}"

  replay:
    build: .
    command: ["replay", "--run", "fixtures/replay/runs/${REPLAY_RUN:-1786831955}"]
    volumes:
      - ./fixtures/replay/runs:/app/fixtures/replay/runs
