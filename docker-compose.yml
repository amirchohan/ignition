services:
  server:
    build: .
    command: ["server", "--config", "configs/server.docker.yaml"]
    ports:
      - "19000:19000/tcp"
      - "19001:19001/tcp"
      - "19002:19002/udp"
    volumes:
      - ./fixtures/replay/runs:/app/fixtures/replay/runs

  trading-client:
    build: .
    command: ["trading-client", "--config", "configs/trading-client.docker.yaml"]
    depends_on:
      - server
    stdin_open: true
    tty: true
    environment:
      TERM: "${TERM:-xterm-256color}"

  control-client:
    build: .
    command: ["control-client", "--config", "configs/control-client.docker.yaml"]
    depends_on:
      - server
    stdin_open: true
    tty: true
    environment:
      TERM: "${TERM:-xterm-256color}"

  benchmark:
    build: .
    command:
      - /bin/sh
      - -c
      - |
        set -- benchmark \
          --orders "$${ORDERS:-1000000}" \
          --warmup "$${WARMUP:-50000}" \
          --workload "$${WORKLOAD:-mixed}" \
          --schedule "$${SCHEDULE:-burst}" \
          --config configs/benchmark.yaml
        if [ "$${SCHEDULE:-burst}" = "open-loop" ]; then
          set -- "$$@" --target-rate "$${TARGET_RATE:?TARGET_RATE is required for open-loop benchmarks}"
        fi
        exec "$$@"
    environment:
      ORDERS: "${ORDERS:-1000000}"
      WARMUP: "${WARMUP:-50000}"
      WORKLOAD: "${WORKLOAD:-mixed}"
      SCHEDULE: "${SCHEDULE:-burst}"
      TARGET_RATE: "${TARGET_RATE:-}"

  replay:
    build: .
    command: ["replay", "--run", "${REPLAY_RUN:-1786693693}", "--config", "configs/replay.yaml"]
    volumes:
      - ./fixtures/replay/runs:/app/fixtures/replay/runs
